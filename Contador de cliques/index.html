<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contador de Cliques</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="card">
    <h1>Contador de Cliques</h1>
    <p>Use os botões para alterar o contador.</p>
    <output id="count" aria-live="polite">0</output>
    <div class="buttons">
      <button id="decrease" type="button">−1</button>
      <button id="reset" type="button">Zerar</button>
      <button id="increase" type="button">+1</button>
    </div>
  </main>
  <script src="script.js"></script>
</body>
</html>
